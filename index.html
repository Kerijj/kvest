<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>S.I.A. TERMINAL | CASE #77-B: THE TRAITOR</title>
    <style>
        :root { 
            --gold: #c2b280; --bg: #0a0a0a; --panel: #111; 
            --text: #d1c7ac; --red: #ff3333; --cyan: #00cccc; --green: #00ff66; 
        }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; margin: 0; padding: 10px; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #case-file { max-width: 1100px; width: 100%; background: #0d0d0d; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; padding: 20px; box-shadow: 0 0 50px #000; position: relative; }
        header { border-bottom: 2px solid var(--gold); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .top-row { display: grid; grid-template-columns: 1fr 300px; gap: 15px; height: 260px; }
        .info-container { display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
        #task-box { background: #1a1a1a; border: 1px solid var(--gold); padding: 12px; font-size: 0.85em; border-left: 5px solid var(--gold); }
        #archive-box { background: #000; border: 1px solid #444; padding: 15px; flex-grow: 1; overflow-y: auto; font-size: 0.88em; border-left: 5px solid var(--cyan); line-height: 1.4; }

        .suspect-list { background: var(--panel); border: 1px solid #333; padding: 10px; overflow-y: auto; }
        .suspect-card { background: #1a1a1a; padding: 8px; border: 1px solid #333; margin-bottom: 5px; cursor: pointer; font-size: 0.75em; }
        .suspect-card:hover { border-color: var(--gold); background: #222; }

        #action-zone { flex-grow: 1; background: #050505; border: 1px solid #222; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .safe-dial { width: 65px; height: 65px; border: 3px double var(--gold); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.8em; cursor: pointer; background: #000; margin: 0 10px; }

        .bottom-row { display: grid; grid-template-columns: 1fr 300px; gap: 15px; height: 110px; }
        .nav-menu { display: flex; gap: 8px; flex-wrap: wrap; }
        #clues-box { background: #111; border: 1px solid #333; padding: 8px; font-size: 0.75em; color: var(--gold); overflow-y: auto; }

        button { background: #1a1a1a; color: var(--text); border: 1px solid #444; padding: 8px 12px; cursor: pointer; font-size: 0.7em; text-transform: uppercase; }
        button:hover:not(:disabled) { background: var(--gold); color: #000; }
        button.active-loc { border-color: var(--cyan); background: #002222; }
        .hidden { display: none !important; }

        /* Эффект тревоги */
        .alarm { animation: flicker 0.2s infinite; }
        @keyframes flicker { 0% { background: #0d0d0d; } 50% { background: #200; } 100% { background: #0d0d0d; } }
    </style>
</head>
<body>

<div id="case-file">
    <header>
        <div>
            <h2 style="margin:0;">S.I.A. TERMINAL | CASE #77-B</h2>
            <small id="status-line" style="color:var(--cyan)">АНАЛИЗ: ОФИС</small>
        </div>
        <div style="text-align:right">
            <div id="timer" style="color:var(--red); font-size: 1.2em; font-weight: bold;">40:00</div>
            <small id="suspicion" style="color:var(--gold)">ТРЕВОГА: 0%</small>
        </div>
    </header>

    <div class="top-row">
        <div class="info-container">
            <div id="task-box">
                <b>ЦЕЛЬ:</b> Сейф. <span id="formula" style="color:var(--gold)">Код: [Алон:посл] - [Ицхак:1-я] - [Марк:1-я]</span>
            </div>
            <div id="archive-box">
                <span style="opacity:0.5">Выберите файл...</span>
            </div>
        </div>
        <div class="suspect-list" id="suspects"></div>
    </div>

    <div id="action-zone">
        <div id="mod-safe">
            <div class="safe-dial" onclick="spin(0)" id="d0">0</div>
            <div class="safe-dial" onclick="spin(1)" id="d1">0</div>
            <div class="safe-dial" onclick="spin(2)" id="d2">0</div>
            <p style="text-align:center"><button onclick="checkSafe()">ВЗЛОМАТЬ</button></p>
        </div>

        <div id="mod-lab" class="hidden">
            <button onclick="lab('chem')">АНАЛИЗ ЛАКА</button>
            <button onclick="lab('dna')">ДНК-ТЕСТ (ТРЕБУЕТСЯ ДОПУСК)</button>
        </div>

        <div id="mod-server" class="hidden" style="text-align:center">
            <p id="server-msg" style="color:var(--green)">СИСТЕМА ЗАБЛОКИРОВАНА ДАНИ</p>
            <input type="password" id="pass" placeholder="КЛЮЧ" style="background:#000; border:1px solid var(--green); color:var(--green); padding:8px; text-align:center;"><br><br>
            <button onclick="checkServer()">ОБХОД ЗАЩИТЫ (1392)</button>
        </div>

        <div id="mod-text" class="hidden" style="text-align:center; padding: 20px;">
            <p id="loc-desc"></p>
        </div>
    </div>

    <div class="bottom-row">
        <div class="nav-menu">
            <button id="btn-office" class="active-loc" onclick="go('office')">ОФИС</button>
            <button id="btn-lab" class="hidden" onclick="go('lab')">ЛАБОРАТОРИЯ</button>
            <button id="btn-post" class="hidden" onclick="go('post')">ПОЧТА</button>
            <button id="btn-server" class="hidden" onclick="go('server')">СЕРВЕРНАЯ</button>
            <button id="btn-workshop" class="hidden" onclick="go('workshop')">МАСТЕРСКАЯ</button>
            <button id="btn-airport" class="hidden" style="color:var(--red)" onclick="go('airport')">АЭРОПОРТ</button>
        </div>
        <div id="clues-box">
            <div id="clues-list"></div>
        </div>
    </div>
</div>

<script>
    const suspects = [
        { name: "Алон (Охрана)", bio: "Жетон №48<b>3</b>. Видел Дани в серверной ночью. Алон нашел синюю нить у сейфа." },
        { name: "Ицхак (Ювелир)", bio: "Стаж: <b>1</b>5 лет. Долги. Его отпечатки на банке с лаком, но он говорит, что банку украли." },
        { name: "Марк (Курьер)", bio: "ID: <b>2</b>-00-9. Серая куртка. Привез посылку для Эли." },
        { name: "Эли (Механик)", bio: "Синяя куртка. Спец по химии. Утверждает, что Дани просил его 'покрасить' детали." },
        { name: "Сара (Жена)", bio: "Письмо Ицхаку: 'Сделай это, и долг будет закрыт'. Подпись подделана?" },
        { name: "Дани (IT)", bio: "Жетон №<b>909</b>. Удалил записи. Единственный, кто мог подделать письма Сары." }
    ];

    let state = { dials: [0,0,0], clues: [], time: 2400, suspicion: 0, serverHacked: false };

    function init() {
        const list = document.getElementById('suspects');
        suspects.forEach(s => {
            const d = document.createElement('div');
            d.className = "suspect-card";
            d.innerHTML = `<strong>${s.name}</strong>`;
            d.onclick = () => { document.getElementById('archive-box').innerHTML = `<b>ДАННЫЕ:</b> ${s.bio}`; };
            list.appendChild(d);
        });
        setInterval(() => {
            state.time--;
            let m = Math.floor(state.time/60), s = state.time%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
        }, 1000);
    }

    function spin(i) { state.dials[i] = (state.dials[i]+1)%10; document.getElementById(`d${i}`).innerText = state.dials[i]; }

    function checkSafe() {
        if (state.dials.join('') === '312') {
            document.getElementById('archive-box').innerHTML = "<b>УЛИКА:</b> Сейф пуст. На дне — синяя нить. На мониторе Дани мигает надпись: 'НЕ ТУДА СМОТРИШЬ'.";
            addClue("Синяя нить (Эли?)"); unlock('lab'); go('lab');
        } else { increaseSuspicion(20); }
    }

    function lab(type) {
        if (type === 'dna') {
            if (!state.serverHacked) alert("ДОСТУП ЗАБЛОКИРОВАН АДМИНИСТРАТОРОМ!");
            else {
                document.getElementById('archive-box').innerHTML = "<b>ДНК:</b> На нити кровь. Она совпадает с Эли, но в базе Дани изменил данные на Ицхака! Дани — соучастник.";
                addClue("Дани подменил ДНК");
            }
        } else {
            document.getElementById('archive-box').innerHTML = "<b>ЛАК:</b> Это спецсостав. Такой заказывал Эли через Марка. Проверьте ПОЧТУ.";
            unlock('post');
        }
    }

    function checkServer() {
        if (document.getElementById('pass').value === '1392') {
            state.serverHacked = true;
            document.getElementById('archive-box').innerHTML = "<b>СИСТЕМА:</b> Вы получили рут-права. Видно, как Дани и Эли делят камни в Мастерской. Идите туда.";
            addClue("Сговор Дани и Эли");
            unlock('workshop'); go('workshop');
        } else { increaseSuspicion(30); }
    }

    function go(loc) {
        document.querySelectorAll('.nav-menu button').forEach(b => b.classList.remove('active-loc'));
        document.getElementById(`btn-${loc}`).classList.add('active-loc');
        document.querySelectorAll('#action-zone > div').forEach(d => d.classList.add('hidden'));

        if (loc === 'office') document.getElementById('mod-safe').classList.remove('hidden');
        else if (loc === 'lab') document.getElementById('mod-lab').classList.remove('hidden');
        else if (loc === 'server') document.getElementById('mod-server').classList.remove('hidden');
        else {
            document.getElementById('mod-text').classList.remove('hidden');
            let d = document.getElementById('loc-desc');
            if (loc === 'post') { d.innerHTML = "<b>ПОЧТА:</b> Заказ 'серого лака' оплачен со счета Дани! Теперь всё сходится. В СЕРВЕРНУЮ."; unlock('server'); }
            if (loc === 'workshop') { d.innerHTML = "<b>МАСТЕРСКАЯ:</b> Пусто. Но на стене надпись: 'МЫ В АЭРОПОРТУ'. Поспешите!"; unlock('airport'); }
            if (loc === 'airport') final();
        }
    }

    function increaseSuspicion(val) {
        state.suspicion += val;
        document.getElementById('suspicion').innerText = `ТРЕВОГА: ${state.suspicion}%`;
        if (state.suspicion >= 100) { document.getElementById('case-file').classList.add('alarm'); alert("ДАНИ ОБНАРУЖИЛ ВАС И УНИЧТОЖИЛ ВСЕ УЛИКИ!"); location.reload(); }
    }

    function unlock(id) { document.getElementById(`btn-${id}`).classList.remove('hidden'); }
    function addClue(t) { if(!state.clues.includes(t)){state.clues.push(t); document.getElementById('clues-list').innerHTML += `<div>> ${t}</div>`;}}
    
    function final() {
        let n = prompt("КТО ПРЕСТУПНИКИ? (Два имени)");
        if (n.toLowerCase().includes("эли") && n.toLowerCase().includes("дани")) {
            alert("БЛЕСТЯЩЕ! Вы раскрыли двойной заговор. Эли нес камни, а Дани подчищал следы.");
        } else {
            alert("ПРОВАЛ. Вы схватили пешку, а кукловод Дани остался на свободе.");
        }
        location.reload();
    }

    init();
</script>
</body>
</html>
