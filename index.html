<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДОСЬЕ №1944: ВЫБОР ЛИДЕРА</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --accent-gold: #d4af37;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --danger: #8b0000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        #app {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid #333;
            padding: 40px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            position: relative;
        }

        .header {
            border-bottom: 2px solid var(--accent-gold);
            margin-bottom: 30px;
            padding-bottom: 10px;
            text-align: center;
        }

        .header h2 { color: var(--accent-gold); letter-spacing: 5px; margin: 0; font-size: 1rem; }
        .header h1 { margin: 10px 0; font-size: 2rem; text-transform: uppercase; }

        .content { font-size: 1.2rem; line-height: 1.6; margin-bottom: 40px; min-height: 150px; }

        .button-stack { display: flex; flex-direction: column; gap: 20px; }

        .btn {
            background: #252525;
            color: white;
            border: 2px solid var(--accent-gold);
            padding: 20px 30px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .btn:hover {
            background: var(--accent-gold);
            color: black;
            font-weight: bold;
            transform: translateX(10px);
        }

        .btn::before { content: "> "; margin-right: 15px; font-weight: bold; }

        .progress {
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--text-dim);
            text-align: right;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .identity {
            background: #000;
            border: 1px dashed var(--accent-gold);
            padding: 20px;
            margin-top: 20px;
            font-weight: bold;
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <h2>Top Secret / Досье №1944</h2>
        <h1 id="title">Загрузка данных...</h1>
    </div>

    <div id="story-text" class="content"></div>

    <div id="choices" class="button-stack"></div>

    <div class="progress" id="progress-text">Этап: 0 / 7</div>
</div>

<script>
const story = {
    start: {
        title: "ВСТУПЛЕНИЕ",
        text: "Венгрия, 1944 год. Нацисты входят в Будапешт. Вы — глава еврейского комитета. Вы узнаете: Эйхман прибыл, чтобы за 3 месяца очистить страну от вашего народа. Что вы предпримете в первый же день?",
        choices: [
            { text: "Пойти на прямой контакт с СС. Попробовать договориться.", next: "pathA_1" },
            { text: "Уйти в глубокое подполье. Готовить вооруженное сопротивление.", next: "pathB_1" }
        ],
        step: 1
    },

    // --- ВЕТКА А: ПЕРЕГОВОРЫ ---
    pathA_1: {
        title: "ВСТРЕЧА С ПАЛАЧОМ",
        text: "Вы сидите в кабинете Эйхмана. Он предлагает сделку: '10 000 грузовиков в обмен на 1 000 000 жизней'. У вас нет грузовиков, а союзники их не дадут. Ваш ход?",
        choices: [
            { text: "Соврать, что грузовики будут. Блефовать до конца, чтобы выиграть время.", next: "pathA_2" },
            { text: "Предложить 'тестовую группу' спасения за наличные и золото прямо сейчас.", next: "pathA_2" }
        ],
        step: 2
    },
    pathA_2: {
        title: "БИЛЕТ В ЖИЗНЬ",
        text: "Блеф сработал. Эйхман разрешает один поезд в Швейцарию. Но в нем всего 1684 места. В гетто — 450 000 человек. Кто поедет первым?",
        choices: [
            { text: "Ваша семья, друзья и элита общины (врачи, ученые).", next: "pathA_3" },
            { text: "Дети-сироты и активисты молодежных движений.", next: "pathA_3" }
        ],
        step: 3
    },
    pathA_3: {
        title: "ОБЕТ МОЛЧАНИЯ",
        text: "Вы узнаете дату отправки эшелонов в Освенцим для остальных. Если вы расскажете людям правду — начнется паника, и ваш 'Поезд спасения' отменят. Что выберете?",
        choices: [
            { text: "Хранить тайну. Спасти 1684 человека любой ценой.", next: "pathA_4" },
            { text: "Тайно предупредить лидеров других городов о газовых камерах.", next: "pathA_4" }
        ],
        step: 4
    },
    pathA_4: {
        title: "ЗОЛОТО СС",
        text: "СС требует огромный выкуп за каждое место в поезде. У бедных нет денег. Чтобы поезд ушел, вам нужно собрать колоссальную сумму.",
        choices: [
            { text: "Отобрать все ценности у богатых семей из списка, чтобы оплатить места бедным.", next: "pathA_5" },
            { text: "Сдать личные драгоценности комитета и искать каналы в Америке.", next: "pathA_5" }
        ],
        step: 5
    },
    pathA_5: {
        title: "ТЕНЬ ПРЕДАТЕЛЬСТВА",
        text: "Вы помогаете нацистам поддерживать порядок в гетто, чтобы переговоры не сорвались. Люди видят, как вы заходите в штаб СС, и шепчутся, что вы купили себе жизнь ценой их крови.",
        choices: [
            { text: "Продолжать работу, не обращая внимания на проклятия.", next: "pathA_6" },
            { text: "Рискнуть всем и спрятать еще 50 человек в вагонах сверх нормы.", next: "pathA_6" }
        ],
        step: 6
    },
    pathA_6: {
        title: "ФИНАЛЬНЫЙ ПЕРРОН",
        text: "Поезд уходит. 1684 человека спасены. Но в этот же момент 430 000 человек спокойно садятся в вагоны до Освенцима, веря вашим словам о 'переселении'.",
        choices: [
            { text: "УЗНАТЬ ИМЯ ГЕРОЯ И ЕГО СУДЬБУ", next: "final_A" }
        ],
        step: 7
    },

    // --- ВЕТКА Б: ВОССТАНИЕ ---
    pathB_1: {
        title: "ПОДПОЛЬНАЯ ПЕЧАТЬ",
        text: "Вы ушли в подвалы. Ваша цель — сорвать депортацию. Первым делом нужно, чтобы люди узнали правду об Освенциме. Как распространить отчеты выживших?",
        choices: [
            { text: "Печатать листовки и раскидывать их ночью по гетто.", next: "pathB_2" },
            { text: "Передавать информацию через врачей и раввинов устно.", next: "pathB_2" }
        ],
        step: 2
    },
    pathB_2: {
        title: "ПОИСК ОРУЖИЯ",
        text: "Правда известна. Гетто бурлит. Но против танков СС у вас только кухонные ножи. Вы выходите на контакт с венгерским сопротивлением.",
        choices: [
            { text: "Выкупить партию винтовок и гранат у дезертиров.", next: "pathB_3" },
            { text: "Организовать лабораторию по производству зажигательной смеси.", next: "pathB_3" }
        ],
        step: 3
    },
    pathB_3: {
        title: "ОБЛАВА",
        text: "Гестапо накрыло одну из ваших ячеек. Ваш заместитель в плену. Он знает всё. Если его не вытащить — подполье погибнет через 24 часа.",
        choices: [
            { text: "Штурмовать тюрьму малыми силами, рискуя всеми.", next: "pathB_4" },
            { text: "Немедленно свернуть деятельность и бежать в другой район.", next: "pathB_4" }
        ],
        step: 4
    },
    pathB_4: {
        title: "МОМЕНТ ИСТИНЫ",
        text: "Первый эшелон подан к перрону. Тысячи людей стоят в очереди. У вас есть 200 вооруженных бойцов. Что делать?",
        choices: [
            { text: "Дать сигнал к атаке прямо сейчас. Умереть в бою, а не в камере.", next: "pathB_5" },
            { text: "Ждать ночи, чтобы устроить диверсию на железной дороге.", next: "pathB_5" }
        ],
        step: 5
    },
    pathB_5: {
        title: "УЛИЧНЫЕ БОИ",
        text: "Восстание началось. Гетто в огне. Вы понимаете, что мирные жители гибнут под обстрелами артиллерии. Помощь не придет.",
        choices: [
            { text: "Держать оборону до последнего вздоха.", next: "pathB_6" },
            { text: "Попробовать вывести группу детей через канализацию.", next: "pathB_6" }
        ],
        step: 6
    },
    pathB_6: {
        title: "КРАХ",
        text: "Восстание подавлено. Вы лежите на баррикадах. Ни один поезд не ушел, никто не спасен. Но вы не лгали своему народу.",
        choices: [
            { text: "УЗНАТЬ ИМЯ ГЕРОЯ И ЕГО СУДЬБУ", next: "final_B" }
        ],
        step: 7
    },

    // --- ФИНАЛЫ ---
    final_A: {
        title: "РЕАЛЬНОСТЬ",
        text: "Этого человека звали ИСРАЭЛЬ КАСТНЕР. Он выбрал этот путь. Он спас 1684 человека. В 1950-х его судили в Израиле. Судья сказал: 'Он продал душу дьяволу'. В 1957 году его убили у порога дома за 'предательство'.",
        choices: [ { text: "НАЧАТЬ ЗАНОВО", next: "start" } ],
        step: 7
    },
    final_B: {
        title: "РЕАЛЬНОСТЬ",
        text: "Вы выбрали путь чести, но в истории Венгрии 1944 года этот путь не спас никого. Кастнер выбрал переговоры. Он погиб от рук своих, но его 'Поезд спасения' — единственный факт реального спасения большой группы людей в то время.",
        choices: [ { text: "НАЧАТЬ ЗАНОВО", next: "start" } ],
        step: 7
    }
};

function render(sceneId) {
    const scene = story[sceneId];
    document.getElementById('title').innerText = scene.title;
    document.getElementById('story-text').innerText = scene.text;
    document.getElementById('progress-text').innerText = `Этап: ${scene.step} / 7`;
    
    const choicesContainer = document.getElementById('choices');
    choicesContainer.innerHTML = '';
    
    scene.choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = c.text;
        btn.onclick = () => render(c.next);
        choicesContainer.appendChild(btn);
    });
}

render('start');
</script>

</body>
</html>
