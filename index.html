<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>S.I.A. TERMINAL | CASE #77-B</title>
    <style>
        :root { 
            --gold: #c2b280; --bg: #0a0a0a; --panel: #111; 
            --text: #d1c7ac; --red: #ff3333; --cyan: #00cccc; --green: #00ff66; 
        }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; 
            margin: 0; padding: 10px; display: flex; justify-content: center; height: 100vh; box-sizing: border-box;
        }
        #case-file { 
            max-width: 1100px; width: 100%; background: #0d0d0d; border: 1px solid #333; 
            display: flex; flex-direction: column; gap: 10px; padding: 20px; box-shadow: 0 0 50px #000;
        }
        header { border-bottom: 2px solid var(--gold); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Верхняя часть: Досье */
        .top-row { display: grid; grid-template-columns: 1fr 300px; gap: 15px; height: 180px; }
        #display-box { background: #000; border: 1px solid #444; padding: 15px; border-left: 5px solid var(--gold); overflow-y: auto; font-size: 0.9em; }
        .suspect-list { background: var(--panel); border: 1px solid #333; padding: 10px; overflow-y: auto; }
        .suspect-card { background: #1a1a1a; padding: 8px; border: 1px solid #333; margin-bottom: 5px; cursor: pointer; font-size: 0.75em; }
        .suspect-card:hover { border-color: var(--gold); }

        /* Центр: Активная зона (Сейф/Сервер) */
        #action-zone { 
            flex-grow: 1; background: #050505; border: 1px solid #222; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 200px; padding: 20px;
        }

        .safe-dial { 
            width: 70px; height: 70px; border: 3px double var(--gold); border-radius: 50%; 
            display: inline-flex; align-items: center; justify-content: center; 
            font-size: 1.8em; cursor: pointer; background: #000; margin: 0 10px; user-select: none;
        }

        /* Низ: Улики и Меню */
        .bottom-row { display: grid; grid-template-columns: 1fr 300px; gap: 15px; height: 100px; }
        .nav-menu { display: flex; gap: 8px; flex-wrap: wrap; align-content: flex-start; }
        #clues-box { background: #111; border: 1px solid #333; padding: 8px; font-size: 0.75em; color: var(--gold); overflow-y: auto; }

        button { background: #1a1a1a; color: var(--text); border: 1px solid #444; padding: 8px 12px; cursor: pointer; font-size: 0.7em; text-transform: uppercase; }
        button:hover:not(:disabled) { background: var(--gold); color: #000; }
        button.active-loc { border-color: var(--cyan); background: #002222; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="case-file">
    <header>
        <div>
            <h2 style="margin:0;">S.I.A. TERMINAL | CASE #77-B</h2>
            <small id="status-line" style="color:var(--cyan)">ЛОКАЦИЯ: OFFICE</small>
        </div>
        <div id="timer" style="color:var(--red); font-size: 1.4em; font-weight: bold;">40:00</div>
    </header>

    <div class="top-row">
        <div id="display-box">
            <b style="color:var(--gold)">[СИСТЕМА]:</b> Найдите код к сейфу в досье персонала.<br>
            Код = [Жетон Алона(посл. цифра)] - [Стаж Ицхака(1-я цифра)] - [ID Марка(1-я цифра)].
        </div>
        <div class="suspect-list" id="suspects"></div>
    </div>

    <div id="action-zone">
        <div id="mod-safe" class="safe-ui">
            <div class="safe-dial" onclick="spin(0)" id="d0">0</div>
            <div class="safe-dial" onclick="spin(1)" id="d1">0</div>
            <div class="safe-dial" onclick="spin(2)" id="d2">0</div>
            <p style="text-align:center"><button onclick="checkSafe()" style="margin-top:20px; width:180px;">ВЗЛОМАТЬ СЕЙФ</button></p>
        </div>

        <div id="mod-lab" class="hidden">
            <button onclick="lab('chem')">ТЕСТ РАСТВОРИТЕЛЕМ</button>
            <button onclick="lab('uv')">УФ-СКАНИРОВАНИЕ</button>
        </div>

        <div id="mod-server" class="hidden" style="text-align:center">
            <p style="color:var(--green)">ВВЕДИТЕ КЛЮЧ АДМИНИСТРАТОРА (Сумма жетонов Дани и Алона):</p>
            <input type="text" id="pass" style="background:#000; border:1px solid var(--green); color:var(--green); padding:10px; text-align:center;"><br><br>
            <button onclick="checkServer()">ВЫПОЛНИТЬ ВЗЛОМ</button>
        </div>

        <div id="mod-text" class="hidden" style="text-align:center; padding: 10px;">
            <p id="loc-desc" style="font-size: 1.1em;"></p>
        </div>
    </div>

    <div class="bottom-row">
        <div class="nav-menu">
            <button id="btn-office" class="active-loc" onclick="go('office')">ОФИС</button>
            <button id="btn-lab" class="hidden" onclick="go('lab')">ЛАБОРАТОРИЯ</button>
            <button id="btn-post" class="hidden" onclick="go('post')">ПОЧТА</button>
            <button id="btn-server" class="hidden" onclick="go('server')">СЕРВЕРНАЯ</button>
            <button id="btn-workshop" class="hidden" onclick="go('workshop')">МАСТЕРСКАЯ</button>
            <button id="btn-airport" class="hidden" style="color:var(--red)" onclick="go('airport')">АЭРОПОРТ</button>
        </div>
        <div id="clues-box">
            <div style="opacity:0.5; font-size:0.7em;">ЖУРНАЛ УЛИК:</div>
            <div id="clues-list"></div>
        </div>
    </div>
</div>

<script>
    const suspects = [
        { name: "Алон (Охрана)", bio: "Жетон №48<b>3</b>. Альпинист." },
        { name: "Ицхак (Ювелир)", bio: "Стаж: <b>1</b>5 лет." },
        { name: "Марк (Курьер)", bio: "ID: <b>2</b>-00-9. Серый пуховик." },
        { name: "Эли (Механик)", bio: "Химик. Заказывал пуговицы." },
        { name: "Дани (IT)", bio: "Жетон №<b>909</b>. Удалил логи." }
    ];

    let state = { dials: [0,0,0], clues: [], time: 2400 };

    function init() {
        const list = document.getElementById('suspects');
        suspects.forEach(s => {
            const d = document.createElement('div');
            d.className = "suspect-card";
            d.innerHTML = `<strong>${s.name}</strong>`;
            d.onclick = () => { document.getElementById('display-box').innerHTML = `<b>[ДОСЬЕ]:</b> ${s.bio}`; };
            list.appendChild(d);
        });
        setInterval(() => {
            state.time--;
            let m = Math.floor(state.time/60), s = state.time%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
        }, 1000);
    }

    function spin(i) { state.dials[i] = (state.dials[i]+1)%10; document.getElementById(`d${i}`).innerText = state.dials[i]; }

    function checkSafe() {
        if (state.dials.join('') === '312') {
            document.getElementById('display-box').innerHTML = "<b>[УСПЕХ]:</b> Сейф открыт. Внутри порошок. Идите в ЛАБОРАТОРИЮ.";
            addClue("Белый налет"); unlock('lab'); go('lab');
        } else alert("Неверно!");
    }

    function lab(type) {
        if (type === 'chem') {
            document.getElementById('display-box').innerHTML = "Это серый лак. Он маскирует алмазы под металл. Проверьте ПОЧТУ.";
            addClue("Серый лак"); unlock('post'); go('post');
        } else alert("Ничего необычного.");
    }

    function checkServer() {
        if (document.getElementById('pass').value === '1392') {
            document.getElementById('display-box').innerHTML = "<b>[ВЗЛОМ]:</b> Лог восстановлен. Дани скрыл сообщника. В МАСТЕРСКУЮ!";
            addClue("Взлом логов"); unlock('workshop'); go('workshop');
        } else alert("Отказ!");
    }

    function go(loc) {
        document.querySelectorAll('.nav-menu button').forEach(b => b.classList.remove('active-loc'));
        document.getElementById(`btn-${loc}`).classList.add('active-loc');
        document.getElementById('status-line').innerText = `ЛОКАЦИЯ: ${loc.toUpperCase()}`;
        
        document.querySelectorAll('#action-zone > div').forEach(d => d.classList.add('hidden'));

        if (loc === 'office') document.getElementById('mod-safe').classList.remove('hidden');
        else if (loc === 'lab') document.getElementById('mod-lab').classList.remove('hidden');
        else if (loc === 'server') document.getElementById('mod-server').classList.remove('hidden');
        else {
            document.getElementById('mod-text').classList.remove('hidden');
            let d = document.getElementById('loc-desc');
            if (loc === 'post') { d.innerHTML = "<b>ПОЧТА:</b> Найдена посылка 'Пуговицы' от Эли. Идите в СЕРВЕРНУЮ."; unlock('server'); }
            if (loc === 'workshop') { d.innerHTML = "<b>МАСТЕРСКАЯ:</b> Найден билет и план пуговиц-алмазов. В АЭРОПОРТ!"; unlock('airport'); }
            if (loc === 'airport') final();
        }
    }

    function unlock(id) { document.getElementById(`btn-${id}`).classList.remove('hidden'); }
    function addClue(t) { if(!state.clues.includes(t)){state.clues.push(t); document.getElementById('clues-list').innerHTML += `<div>> ${t}</div>`;}}
    
    function final() {
        let n = prompt("КТО ВОР?");
        let i = prompt("ГДЕ АЛМАЗЫ?");
        if (n.toLowerCase().includes("эли") && i.toLowerCase().includes("пуговиц")) alert("ПОБЕДА!");
        else alert("УПУЩЕН...");
        location.reload();
    }

    init();
</script>
</body>
</html>
